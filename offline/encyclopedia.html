لول-پاشی":"index.html#tag-1705","/product-tag/کود-محلول-در-آب":"index.html#tag-1709","/product-tag/کود-مخصوص-باغ-و-ویلا":"index.html#tag-205","/product-tag/کود-نیتروژن-بالا":"index.html#tag-133","/calendar-category/orchard-trees":"calendar.html#calendar-category-211","/calendar-category/field-crops":"calendar.html#calendar-category-214","/calendar-category/leafy-vegetables":"calendar.html#calendar-category-213","/calendar-category/vegetables-fruit":"calendar.html#calendar-category-212","/calendar-category/ornamental-plants":"calendar.html#calendar-category-215","/category/news":"website.html#post-category-19","/category/readings":"website.html#post-category-18","/category/gardening-tools":"website.html#post-category-1643","/category/uncategorized":"website.html#post-category-1","/category/blogs":"website.html#post-category-20"};function offlineHref(raw){try{const u=new URL(raw,'https://ekadmall.com/');if(!['http:','https:','mailto:','tel:'].includes(u.protocol))return null;if(u.hostname.replace(/^www\./,'')==='ekadmall.com'){const key=decodeURIComponent(u.pathname).replace(/\/+$/,'');return offlineLinks[key]||u.href}return u.href}catch{return null}}function cleanLinks(doc){doc.querySelectorAll('script,style,iframe,object,embed,form,img,video,audio,link').forEach(e=>e.remove());doc.querySelectorAll('*').forEach(e=>{const href=e.tagName==='A'?e.getAttribute('href'):null;for(const a of [...e.attributes])e.removeAttribute(a.name);if(href){const safe=offlineHref(href);if(safe)e.setAttribute('href',safe)}})}const data={"content":"\n\u003cp class=\"wp-block-paragraph\">به \u003cstrong>دانشنامه کشاورز\u003c/strong> خوش آمدید. این بخش به گونه‌ای طراحی شده است که مانند یک مرجع کامل و در دسترس، پاسخگوی سوالات فنی و علمی شما در حوزه کشاورزی باشد. هدف ما این است که اطلاعات پیچیده کشاورزی را به زبانی ساده و قابل فهم ارائه دهیم تا استفاده از آن‌ها برای تمامی عزیزان، چه در مزرعه و چه در باغ، آسان باشد.\u003c/p>\n\n\n\n\u003cp class=\"wp-block-paragraph\">برای یافتن پاسخ سوال خود (مانند «کود NPK چیست؟» یا «روش آبیاری قطره‌ای»)، کافیست کلمه یا عبارت مورد نظر را در کادر جستجوی بالا وارد کنید. سیستم ما به سرعت مطلب مرتبط را پیدا کرده و یک توضیح \u003cstrong>کوتاه، دقیق و مفید\u003c/strong> (در حد دو پاراگراف) نمایش می‌دهد. این روش به شما کمک می‌کند تا بدون اتلاف وقت، به دانش تخصصی مورد نیاز خود دسترسی پیدا کنید و در تصمیم‌گیری‌های کشاورزی خود دقیق‌تر عمل کنید.\u003c/p>\n\n\n\n\n\n\n\u003csection class=\"block block-faq\" id=\"faq-block_706f83c5a9219a621c2732673df8b8a8\">\n\t\u003cdiv class=\"faq\">\n\t\t\u003cdiv class=\"container\">\n\t\t\t\u003c!-- باکس جستجو -->\n\t\t\t\u003cdiv class=\"faq-search-header-box mb-4 p-4\">\n\t\t\t\t\u003cstrong>جستجو سریع در عنوان و متن\n\t\t\t\t\tدانشنامه کشاورز\u003c/strong>\n\t\t\t\t\u003cinput type=\"text\" id=\"faqSearchInput\" class=\"form-control mt-2 py-3\" placeholder=\"جستجو  ...\">\n\t\t\t\u003c/div>\n\t\t\t\u003cdiv class=\"row justify-content-center align-content-stretch align-items-center\">\n\t\t\t\t\u003cdiv class=\"col-sm-10 col-12 \">\n\t\t\t\t\t\u003cdiv class=\"faq-accordion faq-search-box p-4\">\n\t\t\t\t\t\t\u003cdiv class=\"accordion schema-faq wp-block-yoast-faq-block\" id=\"accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_1\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_1\" aria-expanded=\"true\" aria-controls=\"collapse_1\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">1\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tخاک چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_1\" class=\"accordion-collapse schema-faq-question collapse show\" aria-labelledby=\"collapse_1\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>خاک بستر زنده و حیات‌بخش گیاهان است که از ترکیب مواد معدنی، آلی، آب و هوا تشکیل شده است. این محیط نه تنها فیزیکی برای ریشه‌دوانی گیاه فراهم می‌کند، بلکه منبع اصلی تأمین آب و عناصر غذایی ضروری برای رشد و توسعه گیاهان محسوب می‌شود.\u003c/p>\n\u003cp>کیفیت خاک تعیین‌کننده اصلی حاصلخیزی زمین و کیفیت محصول نهایی است. خاک سالم دارای ساختار مناسب، تهویه خوب و تعادل در عناصر غذایی است که به ریشه‌ها اجازه می‌دهد اکسیژن و مواد مغذی را به راحتی جذب کنند و گیاه به صورت پایدار رشد نماید.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_2\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_2\" aria-expanded=\"false\" aria-controls=\"collapse_2\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">2\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tpH خاک چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_2\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_2\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>pH خاک معیاری برای اندازه‌گیری میزان اسیدی یا قلیایی بودن خاک است که روی مقیاس ۱ تا ۱۴ اندازه‌گیری می‌شود. این شاخص نشان می‌دهد که محیط خاک چقدر با جذب عناصر غذایی توسط گیاه سازگار است؛ معمولاً خاک‌های با pH بین ۶ تا ۷.۵ برای اکثر گیاهان زراعی و باغی ایده‌آل هستند.\u003c/p>\n\u003cp>اگر pH خاک بسیار پایین (اسیدی) یا بسیار بالا (قلیایی) باشد، عناصر غذایی مهم در خاک قفل شده و گیاه نمی‌تواند آن‌ها را جذب کند، حتی اگر مقدار کود در خاک زیاد باشد. بنابراین، تنظیم pH خاک اولین گام برای بهره‌وری حداکثری از کودهای داده شده است.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_3\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_3\" aria-expanded=\"false\" aria-controls=\"collapse_3\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">3\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tشوری خاک (EC) چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_3\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_3\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>شوری خاک که با شاخص EC (هدایت الکتریکی) سنجیده می‌شود، نشان‌دهنده میزان املاح محلول (مانند سدیم، کلرید و سولفات) در آب خاک است. شوری بالا باعث می‌شود ریشه گیاه در جذب آب دچار مشکل شود، زیرا غلظت املاح در خاک از غلظت داخل ریشه بیشتر شده و به صورت عکس، آب از گیاه خارج می‌شود.\u003c/p>\n\u003cp>افزایش شوری خاک باعث سوختگی برگ‌ها، توقف رشد و کاهش شدید محصول می‌شود. کشاورزان باید با آبیاری مناسب (شستشوی املاح) و استفاده از اصلاح‌کننده‌های خاک، سطح شوری را کاهش دهند تا گیاه بتواند بدون تنش آبی و نمکی رشد کند.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_4\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_4\" aria-expanded=\"false\" aria-controls=\"collapse_4\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">4\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tمواد آلی خاک چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_4\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_4\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>مواد آلی خاک شامل بقایای گیاهی و جانوری در حال تجزیه، کودهای دامی پوسیده و میکروارگانیسم‌های مفید خاک است. این مواد نقش حیاتی در بهبود ساختار خاک، افزایش ظرفیت نگهداری آب و تهویه بهتر خاک ایفا می‌کنند و به خاک حالت دانه‌دانه و سبک می‌دهند.\u003c/p>\n\u003cp>وجود مواد آلی کافی باعث می‌شود خاک در برابر فرسایش مقاوم شود و به عنوان یک مخزن غذایی تدریجی عمل کند. کودهای آلی مانند کمپوست و ورمی‌کمپوست منابع اصلی افزایش مواد آلی هستند که علاوه بر تغذیه گیاه، جمعیت میکروب‌های مفید خاک را نیز تقویت می‌کنند.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_5\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_5\" aria-expanded=\"false\" aria-controls=\"collapse_5\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">5\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tآزمایش خاک چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_5\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_5\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>آزمایش خاک یک بررسی علمی و دقیق از ویژگی‌های شیمیایی، فیزیکی و بیولوژیکی خاک مزرعه است. در این آزمایش، نمونه‌ای از خاک برداشته شده و در آزمایشگاه مورد سنجش قرار می‌گیرد تا میزان عناصر غذایی، pH، شوری و سایر پارامترها مشخص شود.\u003c/p>\n\u003cp>هدف اصلی آزمایش خاک، پرهیز از مصرف بی‌رویه و نادرست کود است. با دانستن دقیق نیازهای خاک، کشاورز می‌تواند فقط همان مقداری از کود را مصرف کند که خاک واقعاً نیاز دارد، که هم در هزینه‌ها صرفه‌جویی می‌کند و هم از آلودگی محیط زیست جلوگیری می‌نماید.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_6\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_6\" aria-expanded=\"false\" aria-controls=\"collapse_6\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">6\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tچالکود چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_6\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_6\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>چالکود روشی است که در آن کودهای دامی پوسیده، فسفات و گاهی ازت در چاله‌هایی با عمق مشخص (معمولاً در ناحیه فعال ریشه درختان) دفن می‌شود. این کار معمولاً در فصل خواب درختان یا زمان‌هایی که آبیاری ممکن است باعث شستشوی کود نشود، انجام می‌گیرد.\u003c/p>\n\u003cp>مزیت اصلی چالکود، تأمین طولانی‌مدت مواد غذایی و اصلاح ساختار خاک در عمق است. با دفن کود، خطر فرار نیتروژن به هوا کاهش می‌یابد و مواد آلی به طور مستقیم در معرض ریشه‌های عمقی قرار می‌گیرند که برای درختان میوه بسیار موثرتر از پخش سطحی است.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_7\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_7\" aria-expanded=\"false\" aria-controls=\"collapse_7\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">7\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tمحلول‌پاشی چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_7\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_7\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>محلول‌پاشی روشی است که در آن کودهای محلول‌پذیر مستقیماً بر روی برگ‌ها و اندام هوایی گیاه پاشیده می‌شوند. جذب از طریق برگ‌ها بسیار سریع‌تر از جذب از طریق ریشه است و برای جبران سریع کمبودهای غذایی یا رفع تنش‌های ناگهانی مناسب است.\u003c/p>\n\u003cp>این روش به ویژه برای ریزمغذی‌ها (مانند آهن، روی و منگنز) و در زمان‌هایی که ریشه‌ها به دلیل سرما، شوری یا بیماری توانایی جذب ندارند، کاربرد دارد. البته باید دقت کرد که غلظت محلول بیش از حد نباشد تا باعث سوختگی برگ‌ها نشود.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_8\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_8\" aria-expanded=\"false\" aria-controls=\"collapse_8\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">8\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکوددهی از طریق آبیاری چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_8\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_8\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کودده " data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_17\" aria-expanded=\"false\" aria-controls=\"collapse_17\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">17\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tورمی‌کمپوست چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_17\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_17\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>ورمی‌کمپوست نوعی ویژه از کمپوست است که فرآیند تجزیه مواد آلی در آن توسط کرم‌های خاکی (به ویژه کرم خاکی قرمز) انجام می‌شود. کرم‌ها مواد آلی را می‌خورند و از طریق دستگاه گوارش خود به کودی بسیار غنی و با کیفیت تبدیل می‌کنند.\u003c/p>\n\u003cp>ورمی‌کمپوست نسبت به کمپوست معمولی غلظت مواد مغذی بالاتری دارد و حاوی آنزیم‌ها و هورمون‌های رشد طبیعی است که به رشد سریع‌تر گیاه کمک می‌کند. این کود فاقد بوی بد است و برای گلخانه‌ها، باغچه‌ها و محصولات با ارزش بسیار مناسب است.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_18\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_18\" aria-expanded=\"false\" aria-controls=\"collapse_18\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">18\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود سبز چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_18\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_18\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کود سبز به کاشت گیاهانی مانند یونجه، نولیا یا لوبیا و سپس شخم زدن آن‌ها در خاک قبل از گلدهی گفته می‌شود. این گیاهان با ریشه‌های خود خاک را سست می‌کنند و با ریشه‌هایشان مواد آلی و نیتروژن (در مورد گیاهان خانواده باقلائیان) به خاک اضافه می‌کنند.\u003c/p>\n\u003cp>استفاده از کود سبز یک روش ارگانیک و طبیعی برای بازسازی خاک، جلوگیری از فرسایش و افزایش حاصلخیزی است. این روش هزینه کمی دارد و علاوه بر تغذیه خاک، به کنترل علف‌های هرز و حفظ رطوبت خاک نیز کمک می‌کند.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_19\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_19\" aria-expanded=\"false\" aria-controls=\"collapse_19\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">19\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود گیاهی چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_19\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_19\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کود گیاهی (یا هیومیک اسید و استخراصات گیاهی) از تجزیه مواد گیاهی یا استخراج مستقیم از گیاهان خاص به دست می‌آید. این کودها حاوی هورمون‌های طبیعی رشد، اسیدهای آمینه و مواد فعال زیستی هستند که به گیاه کمک می‌کنند تا بهتر رشد کند و با تنش‌ها مقابله نماید.\u003c/p>\n\u003cp>این کودها بیشتر به عنوان تقویت‌کننده و بهبوددهنده عملکرد گیاه استفاده می‌شوند تا منبع اصلی عناصر غذایی. آن‌ها جذب مواد غذایی را تسهیل کرده و مقاومت گیاه در برابر بیماری‌ها و شرایط نامساعد محیطی را افزایش می‌دهند.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class ollapse schema-faq-question collapse \" aria-labelledby=\"collapse_21\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کود کامل کودی است که حاوی هر سه عنصر اصلی NPK به همراه مقادیر قابل توجهی عناصر فرعی و ریزمغذی‌ها باشد. هدف این کودها تأمین همزمان نیازهای اساسی گیاه برای رشد vegetative (پیکره‌ای) و generative (تولید مثمر) است.\u003c/p>\n\u003cp>استفاده از کود کامل در دوره‌هایی که گیاه نیاز غذایی بالایی دارد یا زمانی که خاک فاقد تعادل عناصر است، بسیار مفید است. این کودها کار را برای کشاورز ساده می‌کنند زیرا با یک نوبت مصرف، طیف وسیعی از نیازهای غذایی گیاه پوشش داده می‌شود.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_22\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_22\" aria-expanded=\"false\" aria-controls=\"collapse_22\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">22\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود مرکب چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_22\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_22\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کود مرکب به کودی گفته می‌شود که از ترکیب شیمیایی یا فیزیکی دو یا چند کود ساده (مثل اوره و سوپر فسفات) به دست می‌آید و حاوی بیش از یک عنصر غذایی اصلی است. برای مثال کودهای DAP یا MAP انواعی از کودهای مرکب هستند.\u003c/p>\n\u003cp>مزیت کودهای مرکب، سهولت در مصرف و یکنواختی در توزیع عناصر غذایی است. کشاورز مجبور نیست چندین نوع کود جداگانه را پخش کند، که این موضوع باعث صرفه‌جویی در زمان و کاهش خطاهای انسانی در n>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_24\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_24\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کودهای میکرو یا ریزمغذی شامل عناصری هستند که گیاه به مقادیر بسیار ناچیز اما حیاتی به آن‌ها نیاز دارد. این عناصر شامل آهن، روی، منگنز، بور، مس، مولیبدن و کلر هستند.\u003c/p>\n\u003cp>اگرچه نیاز گیاه به این عناصر کم است، اما نقش آن‌ها در فرآیندهای فیزیولوژیک مانند فتوسنتز، سنتز پروتئین و تولید هورمون‌ها بسیار کلیدی است. کمبود حتی یکی از این عناصر می‌تواند باعث بیماری‌های خاص و کاهش شدید محصول شود.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_25\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_25\" aria-expanded=\"false\" aria-controls=\"collapse_25\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">25\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود کلاته چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_25\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_25\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp>کود کلاته کودی است که در آن عنصر ریزمغذی (مثل آهن یا روی) به یک مولکول آلی (کلات‌کننده) متصل شده است. این اتصال باعث می‌شود عنصر در خاک مقاوم شود و توسط ریشه یا برگ به راحتی جذب گیاه گردد، حتی در خاک‌هایی با pH بالا که عناصر معمولی به سختی جذب می‌شوند.\u003c/p>\n\u003cp>کلات‌ها جذب بسیار بالاتر و کارایی بیشتری نسبت به کودهای معمولی دارند. این کودها به ویژه برای رف u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"z-0 flex min-h-[46px] justify-start\">\u003c/div>\n\u003cdiv class=\"mt-3 w-full empty:hidden has-[&gt;_:empty]:hidden\">\n\u003cdiv class=\"text-center\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"[--thread-content-max-width:40rem] @w-lg/main:[--thread-content-max-width:48rem] mx-auto max-w-(--thread-content-max-width) flex-1\" data-conversation-screenshot-content=\"\">\n\u003cdiv>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"pointer-events-none -mt-px h-px translate-y-(--scroll-root-safe-area-inset-bottom)\" aria-hidden=\"true\">\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_38\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_38\" aria-expanded=\"false\" aria-controls=\"collapse_38\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">38\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tتفاوت کود نیتروژن و کود اوره  چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_38\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_38\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp class=\"PDq2pG_selectionAnchorContainer\" dir=\"auto\" data-start=\"0\" data-end=\"248\">تفاوت اصلی این است که نیتروژن یک عنصر غذایی است، اما اوره یک نوع کود نیتروژنه محسوب می‌شود. کودهای نیتروژنه گروهی از کودها هستند که نیتروژن مورد نیاز گیاه را تأمین می‌کنند و شامل انواع مختلفی مانند اوره، نیترات آمونیوم و سولفات آمونیوم می‌شوند.\u003c/p>\n\u003cp dir=\"auto\" data-start=\"250\" data-end=\"506\" data-is-last-node=\"\" data-is-only-node=\"\">اوره با فرمول CO(NH₂)₂ یکی از پرمصرف‌ترین منابع نیتروژن است و حدود ۴۶٪ نیتروژن دارد. بنابراین هر اوره یک کود نیتروژنه است، اما هر کود نیتروژنه الزاماً اوره نیست. انتخاب بین انواع کودهای نیتروژنه به محصول، مرحله رشد، شرایط خاک و روش مصرف بستگی دارد.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_39\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_39\" aria-expanded=\"false\" aria-controls=\"collapse_39\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">39\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود سولفات چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_39\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_39\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp class=\"PDq2pG_selectionAnchorContainer\" dir=\"auto\" data-start=\"22\" data-end=\"324\">کود سولفات به گروهی از کودها گفته می‌شود که یکی از عناصر غذایی مورد نیاز گیاه را به شکل سولفات تأمین می‌کنند. از انواع شناخته‌شده آن می‌توان به سولفات پتاسیم، سولفات آمونیوم، سولفات منیزیم و سولفات روی اشاره کرد. بسته به نوع کود، علاوه بر عنصر اصلی، ممکن است گوگرد نیز در اختیار گیاه قرار گیرد.\u003c/p>\n\u003cp dir=\"auto\" data-start=\"326\" data-end=\"576\" data-is-last-node=\"\" data-is-only-node=\"\">کودهای سولفاته برای تأمین عناصر غذایی و جبران کمبودهای گیاه استفاده می‌شوند و نوع مناسب آن باید بر اساس نیاز محصول و شرایط خاک انتخاب شود. برای مثال، سولفات پتاسیم هم پتاسیم و هم گوگرد تأمین می‌کند، در حالی که سولفات روی منبع روی و گوگرد است.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-item schema-faq-section my-3\">\n\t\t\t\t\t\t\t\t\t\t\u003ch4 class=\"accordion-header schema-faq-question\" id=\"heading_40\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cbutton class=\"accordion-button collapsed w-100\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapse_40\" aria-expanded=\"false\" aria-controls=\"collapse_40\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cspan class=\"number-faq\">40\u003c/span>\n\t\t\t\t\t\t\t\t\t\t\t\tکود کمپلکس چیست؟\t\t\t\t\t\t\t\t\t\t\t\u003c/button>\n\t\t\t\t\t\t\t\t\t\t\u003c/h4>\n\t\t\t\t\t\t\t\t\t\t\u003cdiv id=\"collapse_40\" class=\"accordion-collapse schema-faq-question collapse \" aria-labelledby=\"collapse_40\" data-bs-parent=\"#accordion\">\n\t\t\t\t\t\t\t\t\t\t\t\u003cdiv class=\"accordion-body\">\n\t\t\t\t\t\t\t\t\t\t\t\t\u003cp dir=\"rtl\" lang=\"fa\">کود کمپلکس کودی است که در آن چندین عنصر غذایی (مثل ازت، فسفر و پتاسیم) به‌صورت یکپارچه در هر دانه کود ترکیب شده‌اند. برخلاف کودهای مخلوط ساده، در کود کمپلکس تمامی عناصر در یک دانه واحد وجود دارند؛ بنابراین هنگام کودپاشی، تغذیه گیاه در تمام نقاط مزرعه کاملاً یکنواخت و متعادل انجام می‌شود.\u003c/p>\n\u003cp dir=\"rtl\" lang=\"fa\">این کودها که معمولاً به شکل گرانول هستند، ماندگاری بهتری در خاک دارند و از هدررفت مواد غذایی جلوگیری می‌کنند. استفاده از کود کمپلکس به دلیل راحتی در مصرف و تأمین هم‌زمان چندین نیاز اصلی گیاه، یکی از روش‌های به‌صرفه و کاربردی برای تغذیه پایه محصولات زراعی و باغی محسوب می‌شود.\u003c/p>\n\t\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t\t\u003cscript type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"خاک چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"خاک بستر زنده و حیات‌بخش گیاهان است که از ترکیب مواد معدنی، آلی، آب و هوا تشکیل شده است. این محیط نه تنها فیزیکی برای ریشه‌دوانی گیاه فراهم می‌کند، بلکه منبع اصلی تأمین آب و عناصر غذایی ضروری برای رشد و توسعه گیاهان محسوب می‌شود.\\nکیفیت خاک تعیین‌کننده اصلی حاصلخیزی زمین و کیفیت محصول نهایی است. خاک سالم دارای ساختار مناسب، تهویه خوب و تعادل در عناصر غذایی است که به ریشه‌ها اجازه می‌دهد اکسیژن و مواد مغذی را به راحتی جذب کنند و گیاه به صورت پایدار رشد نماید.\"}},{\"@type\":\"Question\",\"name\":\"pH خاک چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"pH خاک معیاری برای اندازه‌گیری میزان اسیدی یا قلیایی بودن خاک است که روی مقیاس ۱ تا ۱۴ اندازه‌گیری می‌شود. این شاخص نشان می‌دهد که محیط خاک چقدر با جذب عناصر غذایی توسط گیاه سازگار است؛ معمولاً خاک‌های با pH بین ۶ تا ۷.۵ برای اکثر گیاهان زراعی و باغی ایده‌آل هستند.\\nاگر pH خاک بسیار پایین (اسیدی) یا بسیار بالا (قلیایی) باشد، عناصر غذایی مهم در خاک قفل شده و گیاه نمی‌تواند آن‌ها را جذب کند، حتی اگر مقدار کود در خاک زیاد باشد. بنابراین، تنظیم pH خاک اولین گام برای بهره‌وری حداکثری از کودهای داده شده است.\"}},{\"@type\":\"Question\",\"name\":\"شوری خاک (EC) چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"شوری خاک که با شاخص EC (هدایت الکتریکی) سنجیده می‌شود، نشان‌دهنده میزان املاح محلول (مانند سدیم، کلرید و سولفات) در آب خاک است. شوری بالا باعث می‌شود ریشه گیاه در جذب آب دچار مشکل شود، زیرا غلظت املاح در خاک از غلظت داخل ریشه بیشتر شده و به صورت عکس، آب از گیاه خارج می‌شود.\\nافزایش شوری خاک باعث سوختگی برگ‌ها، توقف رشد و کاهش شدید محصول می‌شود. کشاورزان باید با آبیاری مناسب (شستشوی املاح) و استفاده از اصلاح‌کننده‌های خاک، سطح شوری را کاهش دهند تا گیاه بتواند بدون تنش آبی و نمکی رشد کند.\"}},{\"@type\":\"Question\",\"name\":\"مواد آلی خاک چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"مواد آلی خاک شامل بقایای گیاهی و جانوری در حال تجزیه، کودهای دامی پوسیده و میکروارگانیسم‌های مفید خاک است. این مواد نقش حیاتی در بهبود ساختار خاک، افزایش ظرفیت نگهداری آب و تهویه بهتر خاک ایفا می‌کنند و به خاک حالت دانه‌دانه و سبک می‌دهند.\\nوجود مواد آلی کافی باعث می‌شود خاک در برابر فرسایش مقاوم شود و به عنوان یک مخزن غذایی تدریجی عمل کند. کودهای آلی مانند کمپوست و ورمی‌کمپوست منابع اصلی افزایش مواد آلی هستند که علاوه بر تغذیه گیاه، جمعیت میکروب‌های مفید خاک را نیز تقویت می‌کنند.\"}},{\"@type\":\"Question\",\"name\":\"آزمایش خاک چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"آزمایش خاک یک بررسی علمی و دقیق از ویژگی‌های شیمیایی، فیزیکی و بیولوژیکی خاک مزرعه است. در این آزمایش، نمونه‌ای از خاک برداشته شده و در آزمایشگاه مورد سنجش قرار می‌گیرد تا میزان عناصر غذایی، pH، شوری و سایر پارامترها مشخص شود.\\nهدف اصلی آزمایش خاک، پرهیز از مصرف بی‌رویه و نادرست کود است. با دانستن دقیق نیازهای خاک، کشاورز می‌تواند فقط همان مقداری از کود را مصرف کند که خاک واقعاً نیاز دارد، که هم در هزینه‌ها صرفه‌جویی می‌کند و هم از آلودگی محیط زیست جلوگیری می‌نماید.\"}},{\"@type\":\"Question\",\"name\":\"چالکود چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"چالکود روشی است که در آن کودهای دامی پوسیده، فسفات و گاهی ازت در چاله‌هایی با عمق مشخص (معمولاً در ناحیه فعال ریشه درختان) دفن می‌شود. این کار معمولاً در فصل خواب درختان یا زمان‌هایی که آبیاری ممکن است باعث شستشوی کود نشود، انجام می‌گیرد.\\nمزیت اصلی چالکود، تأمین طولانی‌مدت مواد غذایی و اصلاح ساختار خاک در عمق است. با دفن کود، خطر فرار نیتروژن به هوا کاهش می‌یابد و مواد آلی به طور مستقیم در معرض ریشه‌های عمقی قرار می‌گیرند که برای درختان میوه بسیار موثرتر از پخش سطحی است.\"}},{\"@type\":\"Question\",\"name\":\"محلول‌پاشی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"محلول‌پاشی روشی است که در آن کودهای محلول‌پذیر مستقیماً بر روی برگ‌ها و اندام هوایی گیاه پاشیده می‌شوند. جذب از طریق برگ‌ها بسیار سریع‌تر از جذب از طریق ریشه است و برای جبران سریع کمبودهای غذایی یا رفع تنش‌های ناگهانی مناسب است.\\nاین روش به ویژه برای ریزمغذی‌ها (مانند آهن، روی و منگنز) و در زمان‌هایی که ریشه‌ها به دلیل سرما، شوری یا بیماری توانایی جذب ندارند، کاربرد دارد. البته باید دقت کرد که غلظت محلول بیش از حد نباشد تا باعث سوختگی برگ‌ها نشود.\"}},{\"@type\":\"Question\",\"name\":\"کوددهی از طریق آبیاری چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کوددهی از طریق آبیاری که به آن «آب‌کود» یا Fertigation نیز گفته می‌شود، روشی است که در آن کودهای کاملاً محلول‌پذیر در مخزن آب حل شده و با سیستم‌های آبیاری قطره‌ای یا بارانی به مزرعه منتقل می‌شوند. این روش باعث می‌شود کود به صورت یکنواخت و مستقیم به ناحیه ریشه برسد.\\nاین روش دقت بالایی دارد و مصرف کود را بهینه می‌کند، زیرا اتلاف کود ناشی از تبخیر یا شستشو به حداقل می‌رسد. همچنین با کاهش دفعات رفت و آمد به مزرعه برای کودپاشی، در هزینه‌های نیروی کار صرفه‌جویی می‌شود و دسترسی گیاه به آب و غذا به صورت همزمان و پیوسته فراهم می‌گردد.\"}},{\"@type\":\"Question\",\"name\":\"کود گرانول چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود گرانول دانه‌های سفت و استوانه‌ای یا کروی شکل کود است که با فشرده‌سازی مواد اولیه تولید می‌شود. این شکل فیزیکی باعث می‌شود کود در انبار کردن و حمل و نقل راحت‌تر باشد و در مجاورت ریشه به آرامی حل شود.\\nمزیت اصلی گرانول‌ها مقاومت بیشتر در برابر شستشو نسبت به پودرهاست. این کودها معمولاً برای مصرف در مزارع وسیع و به صورت مکانیکی یا دستی پخش می‌شوند و زمان‌بندی خاصی در آزادسازی مواد غذایی دارند که برای تغذیه پایدار گیاه مفید است.\"}},{\"@type\":\"Question\",\"name\":\"کود پودری چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود پودری به کودی گفته می‌شود که حالت پودر نرم و ریز دارد و معمولاً ارزان‌تر از سایر فرم‌های کود تولید می‌شود. این کودها برای پخش دستی یا مکانیکی روی سطح خاک مناسب هستند و سرعت حل شدن آن‌ها در آب نسبتاً بالاست.\\nبا این حال، پودرهای کودی ممکن است در اثر باد پراکنده شده و راندمان کاهش یابد یا در صورت آبیاری سنگین، سریع‌تر شسته شوند. استفاده از آن‌ها نیاز به دقت بیشتری در زمان پخش و آبیاری دارد تا از هدررفت مواد غذایی جلوگیری شود.\"}},{\"@type\":\"Question\",\"name\":\"کود مایع چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود مایع محلولی است که مواد غذایی در آن کاملاً حل شده‌اند و آماده جذب سریع توسط گیاه هستند. این کودها معمولاً برای محلول‌پاشی یا تزریق در سیستم‌های آبیاری قطره‌ای کاربرد دارند.\\nمزیت بزرگ کودهای مایع، یکنواختی توزیع و سرعت جذب بالاست. همچنین حمل و نقل و دوز دقیق آن‌ها آسان‌تر است. با این حال، عمر انقضای محدود و نیاز به بسته‌بندی‌های خاص، از معایب احتمالی آن‌ها محسوب می‌شود.\"}},{\"@type\":\"Question\",\"name\":\"کود پلت شده چیست ؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود پلت شده کودی است که به شکل دانه‌های کوچک و فشرده‌شده (مشابه دانه‌های غذایی دام) تولید می‌شود. این دانه‌ها معمولاً با یک پوشش پلیمری یا مومی روکش می‌شوند تا مواد غذایی را به تدریج و در طول زمان آزاد کنند.\\nاین نوع کود برای کاهش اتلاف مواد غذایی و تأمین تغذیه بلندمدت گیاه طراحی شده است. پوشش پلت‌ها باعث می‌شود کود در مجاورت ریشه بماند و به آرامی در آب آبیاری حل شود، که این امر جذب را کنترل‌شده و پایدار می‌کند.\"}},{\"@type\":\"Question\",\"name\":\"کود شیمیایی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود شیمیایی یا معدنی، کودی است که در کارخانه و به صورت صنعتی تولید می‌شود و عناصر غذایی آن به صورت نمک‌های معدنی خالص (مانند اوره، سولفات پتاسیم یا سوپر فسفات) در دسترس گیاه قرار می‌گیرد. این کودها معمولاً غلظت بالایی دارند و اثرگذاری سریعی روی رشد گیاه دارند.\\nاستفاده متعادل از کودهای شیمیایی می‌تواند محصول‌دهی را به شدت افزایش دهد، اما مصرف بیش از حد آن‌ها می‌تواند باعث شوری خاک، آلودگی آب‌های زیرزمینی و آسیب به باکتری‌های مفید خاک شود. بنابراین، تعادل بین کود شیمیایی و آلی ضروری است.\"}},{\"@type\":\"Question\",\"name\":\"کود آلی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود آلی از مواد طبیعی گیاهی و جانوری مشتق می‌شود و شامل بقایای گیاهان، کود دامی، کمپوست و فضولات پرنده است. این کودها علاوه بر تأمین عناصر غذایی، مواد آلی را به خاک اضافه کرده و ساختار خاک را بهبود می‌بخشند.\\nکودهای آلی اثرگذاری آهسته‌تری نسبت به کودهای شیمیایی دارند اما اثر آن‌ها پایدارتر است. آن‌ها به حفظ رطوبت خاک کمک کرده و فعالیت میکروارگانیسم‌های مفید را افزایش می‌دهند که در درازمدت باعث حاصلخیزی دائمی زمین می‌شود.\"}},{\"@type\":\"Question\",\"name\":\"کود دامی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود دامی از فضولات حیوانات اهلی مانند گاو، گوسفند، مرغ و اسب حاصل می‌شود. این کود یکی از قدیمی‌ترین و رایج‌ترین منابع تأمین مواد آلی و عناصر غذایی در کشاورزی سنتی و ارگانیک است.\\nبرای استفاده از کود دامی، حتماً باید پوسیده باشد؛ کود تازه می‌تواند حاوی بذر علف‌های هرز، بیماری‌ها و حشرات مضر باشد و همچنین با تولید گرمای زیاد در خاک، ریشه گیاه را بسوزاند. کود دامی پوسیده منابع خوبی از نیتروژن، فسفر و پتاسیم به همراه مواد آلی است.\"}},{\"@type\":\"Question\",\"name\":\"کمپوست چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کمپوست حاصل تجزیه بیولوژیکی مواد آلی مانند ضایعات کشاورزی، برگ‌های خشک، بقایای آشپزخانه و کود دامی توسط میکروب‌ها و قارچ‌ها در حضور اکسیژن است. این فرآیند به تولید یک ماده تیره، نرم و غنی از مواد مغذی تبدیل می‌شود.\\nکمپوست نه تنها یک کود کامل است، بلکه یک اصلاح‌کننده عالی خاک محسوب می‌شود. آن بافت خاک را سبک می‌کند، ظرفیت نگهداری آب را افزایش داده و تعادل میکروبی خاک را برقرار می‌سازد. استفاده از کمپوست روشی پایدار و دوستدار محیط زیست برای تقویت خاک است.\"}},{\"@type\":\"Question\",\"name\":\"ورمی‌کمپوست چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"ورمی‌کمپوست نوعی ویژه از کمپوست است که فرآیند تجزیه مواد آلی در آن توسط کرم‌های خاکی (به ویژه کرم خاکی قرمز) انجام می‌شود. کرم‌ها مواد آلی را می‌خورند و از طریق دستگاه گوارش خود به کودی بسیار غنی و با کیفیت تبدیل می‌کنند.\\nورمی‌کمپوست نسبت به کمپوست معمولی غلظت مواد مغذی بالاتری دارد و حاوی آنزیم‌ها و هورمون‌های رشد طبیعی است که به رشد سریع‌تر گیاه کمک می‌کند. این کود فاقد بوی بد است و برای گلخانه‌ها، باغچه‌ها و محصولات با ارزش بسیار مناسب است.\"}},{\"@type\":\"Question\",\"name\":\"کود سبز چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود سبز به کاشت گیاهانی مانند یونجه، نولیا یا لوبیا و سپس شخم زدن آن‌ها در خاک قبل از گلدهی گفته می‌شود. این گیاهان با ریشه‌های خود خاک را سست می‌کنند و با ریشه‌هایشان مواد آلی و نیتروژن (در مورد گیاهان خانواده باقلائیان) به خاک اضافه می‌کنند.\\nاستفاده از کود سبز یک روش ارگانیک و طبیعی برای بازسازی خاک، جلوگیری از فرسایش و افزایش حاصلخیزی است. این روش هزینه کمی دارد و علاوه بر تغذیه خاک، به کنترل علف‌های هرز و حفظ رطوبت خاک نیز کمک می‌کند.\"}},{\"@type\":\"Question\",\"name\":\"کود گیاهی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود گیاهی (یا هیومیک اسید و استخراصات گیاهی) از تجزیه مواد گیاهی یا استخراج مستقیم از گیاهان خاص به دست می‌آید. این کودها حاوی هورمون‌های طبیعی رشد، اسیدهای آمینه و مواد فعال زیستی هستند که به گیاه کمک می‌کنند تا بهتر رشد کند و با تنش‌ها مقابله نماید.\\nاین کودها بیشتر به عنوان تقویت‌کننده و بهبوددهنده عملکرد گیاه استفاده می‌شوند تا منبع اصلی عناصر غذایی. آن‌ها جذب مواد غذایی را تسهیل کرده و مقاومت گیاه در برابر بیماری‌ها و شرایط نامساعد محیطی را افزایش می‌دهند.\"}},{\"@type\":\"Question\",\"name\":\"کود NPK چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود NPK ترکیبی از سه عنصر اصلی و حیاتی برای رشد گیاه است: نیتروژن (N)، فسفر (P) و پتاسیم (K). هر یک از این عناصر وظایف خاصی دارند: نیتروژن برای رشد برگ و ساقه، فسفر برای ریشه‌زایی و گلدهی، و پتاسیم برای کیفیت محصول و مقاومت گیاه مهم است.\\nاین کودها می‌توانند به صورت ساده (فقط یکی از عناصر) یا مرکب (ترکیب دو یا سه عنصر) باشند. کشاورزان با توجه به نیاز گیاه در مراحل مختلف رشد و نتایج آزمایش خاک، نوع و نسبت NPK مناسب را انتخاب می‌کنند تا تعادل غذایی گیاه حفظ شود.\"}},{\"@type\":\"Question\",\"name\":\"کود کامل چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود کامل کودی است که حاوی هر سه عنصر اصلی NPK به همراه مقادیر قابل توجهی عناصر فرعی و ریزمغذی‌ها باشد. هدف این کودها تأمین همزمان نیازهای اساسی گیاه برای رشد vegetative (پیکره‌ای) و generative (تولید مثمر) است.\\nاستفاده از کود کامل در دوره‌هایی که گیاه نیاز غذایی بالایی دارد یا زمانی که خاک فاقد تعادل عناصر است، بسیار مفید است. این کودها کار را برای کشاورز ساده می‌کنند زیرا با یک نوبت مصرف، طیف وسیعی از نیازهای غذایی گیاه پوشش داده می‌شود.\"}},{\"@type\":\"Question\",\"name\":\"کود مرکب چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود مرکب به کودی گفته می‌شود که از ترکیب شیمیایی یا فیزیکی دو یا چند کود ساده (مثل اوره و سوپر فسفات) به دست می‌آید و حاوی بیش از یک عنصر غذایی اصلی است. برای مثال کودهای DAP یا MAP انواعی از کودهای مرکب هستند.\\nمزیت کودهای مرکب، سهولت در مصرف و یکنواختی در توزیع عناصر غذایی است. کشاورز مجبور نیست چندین نوع کود جداگانه را پخش کند، که این موضوع باعث صرفه‌جویی در زمان و کاهش خطاهای انسانی در دوزدهی می‌شود.\"}},{\"@type\":\"Question\",\"name\":\"کود ماکرو چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کودهای ماکرو کودهایی هستند که عناصر غذایی اصلی و مورد نیاز گیاه به مقدار زیاد را تأمین می‌کنند. این عناصر شامل نیتروژن، فسفر، پتاسیم (ماکروهای اولیه) و کلسیم، منیزیم و گوگرد (ماکروهای ثانویه) می‌شوند.\\nگیاهان به این عناصر به صورت مقادیر زیاد نیاز دارند و کمبود هر یک از آن‌ها می‌تواند باعث توقف رشد یا تغییر رنگ برگ‌ها شود. تأمین متعادل کودهای ماکرو اساس تغذیه گیاهی را تشکیل می‌دهد.\"}},{\"@type\":\"Question\",\"name\":\"کود میکرو (ریزمغذی) چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کودهای میکرو یا ریزمغذی شامل عناصری هستند که گیاه به مقادیر بسیار ناچیز اما حیاتی به آن‌ها نیاز دارد. این عناصر شامل آهن، روی، منگنز، بور، مس، مولیبدن و کلر هستند.\\nاگرچه نیاز گیاه به این عناصر کم است، اما نقش آن‌ها در فرآیندهای فیزیولوژیک مانند فتوسنتز، سنتز پروتئین و تولید هورمون‌ها بسیار کلیدی است. کمبود حتی یکی از این عناصر می‌تواند باعث بیماری‌های خاص و کاهش شدید محصول شود.\"}},{\"@type\":\"Question\",\"name\":\"کود کلاته چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود کلاته کودی است که در آن عنصر ریزمغذی (مثل آهن یا روی) به یک مولکول آلی (کلات‌کننده) متصل شده است. این اتصال باعث می‌شود عنصر در خاک مقاوم شود و توسط ریشه یا برگ به راحتی جذب گیاه گردد، حتی در خاک‌هایی با pH بالا که عناصر معمولی به سختی جذب می‌شوند.\\nکلات‌ها جذب بسیار بالاتر و کارایی بیشتری نسبت به کودهای معمولی دارند. این کودها به ویژه برای رفع سریع کمبودهای ریزمغذی در گیاهانی که در خاک‌های آهکی یا شوره‌زار کشت می‌شوند، بسیار توصیه می‌شوند.\"}},{\"@type\":\"Question\",\"name\":\"نانو کود کلاته چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"نانو کود کلاته ترکیبی از فناوری نانو و شیمی کلاتاسیون است. در این کودها، ذرات مواد مغذی یا کلات‌ها در ابعاد نانو (بسیار ریزتر از حد معمول) تولید می‌شوند تا سطح تماس آن‌ها با گیاه به شدت افزایش یابد.\\nاین ابعاد ریز اجازه می‌دهد مواد مغذی از طریق روزنه‌های برگ یا دیواره سلولی ریشه با سرعت و دقت بیشتری وارد بافت گیاه شوند. نتیجه این است که با دوز بسیار کمتر، اثرگذاری بیشتری نسبت به کودهای معمولی حاصل می‌شود و هدررفت مواد به حداقل می‌رسد.\"}},{\"@type\":\"Question\",\"name\":\"کود نانو چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود نانو کودی است که در فرمولاسیون آن از ذرات یا نانوذرات استفاده شده است تا کارایی جذب مواد غذایی را افزایش دهد. این کودها می‌توانند حاوی عناصر اصلی یا ریزمغذی باشند که به صورت نانوذره تولید شده‌اند.\\nمزیت اصلی نانو کودها، افزایش نفوذپذیری به بافت گیاه و کاهش نیاز به مصرف مواد شیمیایی است. این کودها با اثرگذاری دقیق‌تر، رشد گیاه را تحریک کرده و مقاومت آن را در برابر تنش‌های محیطی بالا می‌برند، هرچند قیمت آن‌ها معمولاً بالاتر از کودهای متداول است.\"}},{\"@type\":\"Question\",\"name\":\"کود آهسته‌رهش چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود آهسته‌رهش کودی است که در آن مواد غذایی با یک پوشش پلیمری یا فرآیند شیمیایی احاطه شده‌اند تا به تدریج و در طول چندین هفته یا ماه آزاد شوند. این روش باعث می‌شود گیاه در طول زمان به صورت پیوسته تغذیه شود.\\nاین نوع کودها نیاز به تعداد دفعات کوددهی را کاهش می‌دهند و خطر شستشوی کود توسط باران یا آبیاری را کم می‌کنند. آن‌ها بهترین گزینه برای گیاهانی هستند که دوره رشد طولانی دارند و نیاز به تغذیه پایدار بدون نوسان شدید غلظت مواد غذایی در خاک دارند.\"}},{\"@type\":\"Question\",\"name\":\"کود اصلاح‌کننده آب و خاک چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"این کودها مواد شیمیایی یا آلی خاصی هستند که برای بهبود ویژگی‌های فیزیکی و شیمیایی خاک و آب آبیاری طراحی شده‌اند. آن‌ها می‌توانند شوری خاک را کاهش دهند، ساختار خاک‌های رسی را باز کنند یا قلیایی بودن آب را خنثی نمایند.\\nاستفاده از این اصلاح‌کننده‌ها به کشاورز کمک می‌کند تا محیط ریشه را برای جذب بهتر مواد غذایی مناسب‌تر کند. آن‌ها اغلب در کنار کودهای غذایی استفاده می‌شوند تا راندمان کل سیستم تولید را بالا ببرند.\"}},{\"@type\":\"Question\",\"name\":\"کودهای زیستی چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود زیستی یعنی میکروب‌های مفید (باکتری و قارچ) که در خاک زندگی می‌کنند و به جذب غذا توسط گیاه کمک می‌کنند. مثلاً باکتری‌های تثبیت کننده نیتروژن یا قارچ‌های میکوریز.\\nاین کودها شیمیایی نیستند و کاملاً طبیعی‌اند. استفاده از آنها باعث می‌شود مصرف کود شیمیایی را تا ۵۰ درصد کم کنید. خاک زنده می‌شود و محصول سالم‌تری دارید.\"}},{\"@type\":\"Question\",\"name\":\"کود ریشه‌زا چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود ریشه‌زا معمولاً حاوی مقادیر بالای فسفر و برخی هورمون‌های رشد (مثل اکسین‌ها) است که هدف اصلی آن تحریک رشد ریشه و توسعه سیستم ریشه‌ای گیاه است. این کودها به ویژه در مرحله نشاء، انتقال نهال و زمان ریشه‌زایی بسیار مهم هستند.\\nسیستم ریشه‌ای قوی و گسترده باعث می‌شود گیاه بتواند آب و مواد غذایی بیشتری از خاک جذب کند و در برابر باد و خشکی مقاوم‌تر باشد. استفاده از کود ریشه‌زا در ابتدای فصل رشد یا پس از هرس سنگین بسیار توصیه می‌شود.\"}},{\"@type\":\"Question\",\"name\":\"کود فروت ست چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود فروت ست (Fruit Set) کودی تخصصی است که برای بهبود تشکیل میوه و جلوگیری از ریزش گل‌ها و میوه‌های جوان طراحی شده است. این کودها معمولاً حاوی عناصری مثل بور، روی و هورمون‌های طبیعی هستند که فرآیند گرده‌افشانی و لقاح را تقویت می‌کنند.\\nاستفاده به موقع از فروت ست در زمان گلدهی می‌تواند درصد میوه‌دهی را به طور چشمگیری افزایش دهد و میوه‌های با کیفیت‌تر و یکنواخت‌تری تولید کند. این کود برای باغ‌های میوه و گلخانه‌ها که ثبات محصول در آن‌ها حیاتی است، بسیار کاربردی است.\"}},{\"@type\":\"Question\",\"name\":\"کود سولفات چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود سولفات به گروهی از کودهای شیمیایی گفته می‌شود که منبع اصلی عنصر غذایی آن‌ها به صورت نمک سولفات است. معروف‌ترین و پرکاربردترین آن‌ها «سولفات پتاسیم» و «سولفات آمونیوم» هستند. این کودها به دلیل حل‌شدن سریع در آب، یکی از بهترین گزینه‌ها برای تغذیه سریع گیاهان، به‌ویژه در سیستم‌های آبیاری قطره‌ای و محلول‌پاشی محسوب می‌شوند.\\nنکته کلیدی در مورد کودهای سولفات، نداشتن کلر است. بسیاری از گیاهان حساس به کلر (مانند سیب‌زمینی، تنباکو، مرکبات و برخی انگورها) نمی‌توانند از کود «کلرید پتاسیم» استفاده کنند، زیرا کلر باعث کاهش کیفیت محصول و حتی سمی شدن گیاه می‌شود. بنابراین، سولفات پتاسیم جایگزین ایده‌آلی برای این محصولات است. همچنین سولفات منیزیم و سولفات روی نیز از انواع دیگر کودهای سولفات هستند که برای جبران کمبود منیزیم، روی و سایر ریزمغذی‌ها کاربرد دارند.\"}},{\"@type\":\"Question\",\"name\":\"کود ضد تنش چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود ضد تنش یا استرس‌زدا کودی است که حاوی اسیدهای آمینه، هیومیک اسید، سیلیسیم یا عصاره‌های جلبکی است و هدف آن کمک به گیاه برای مقابله با شرایط نامساعد محیطی مانند خشکی، گرمای شدید، سرما یا شوری خاک می‌باشد.\\nاین کودها با تقویت سیستم دفاعی گیاه و تنظیم تعادل هورمونی، آسیب‌های ناشی از تنش را کاهش می‌دهند و به گیاه کمک می‌کنند تا سریع‌تر بهبود یابد. استفاده از آن‌ها در فصل‌های پرتنش یا پس از اتفاقات غیرمنتظره مانند تگرگ یا یخبندان بسیار مفید است.\"}},{\"@type\":\"Question\",\"name\":\"کود سولو چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود سولو معمولاً به سولوپتاس یا سولفات پتاسیم (K₂SO₄) اشاره دارد؛ کودی که دو عنصر مهم پتاسیم و گوگرد را برای گیاه تأمین می‌کند. این کود فاقد نیتروژن است و به دلیل نداشتن کلر، در تغذیه بسیاری از محصولات حساس به کلرید مورد استفاده قرار می‌گیرد.\\nسولوپتاس بیشتر برای تأمین پتاسیم در مراحل رشد و تولید محصول استفاده می‌شود و می‌تواند در بهبود کیفیت محصول و تأمین گوگرد مورد نیاز گیاه نقش داشته باشد. این کود بسته به نوع محصول و فرمولاسیون، در کودآبیاری، مصرف خاکی یا محلول‌پاشی قابل استفاده است.\"}},{\"@type\":\"Question\",\"name\":\"کود آمونیوم چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود آمونیوم به گروهی از کودهای نیتروژنه گفته می‌شود که نیتروژن را به شکل آمونیوم در اختیار گیاه قرار می‌دهند. از نمونه‌های شناخته‌شده این گروه می‌توان به سولفات آمونیوم و نیترات آمونیوم اشاره کرد. نیتروژن آمونیومی در رشد رویشی، تشکیل برگ و افزایش رشد گیاه نقش دارد.\\nنوع کود آمونیومی و مقدار مصرف آن باید متناسب با محصول، مرحله رشد و شرایط خاک انتخاب شود. برخی کودهای آمونیومی علاوه بر نیتروژن، عناصر دیگری مانند گوگرد نیز تأمین می‌کنند؛ بنابراین هنگام انتخاب، توجه به ترکیب و آنالیز درج‌شده روی بسته‌بندی اهمیت دارد.\"}},{\"@type\":\"Question\",\"name\":\"کود مونو چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود مونو به‌طور معمول در بازار کود و کشاورزی به کودهایی گفته می‌شود که یکی از عناصر اصلی را به شکل مشخص و با ترکیب نسبتاً ساده تأمین می‌کنند. از نمونه‌های شناخته‌شده آن می‌توان به مونو پتاسیم فسفات (MKP) و مونو آمونیوم فسفات (MAP) اشاره کرد که هرکدام برای تأمین عناصر غذایی متفاوتی استفاده می‌شوند.\\nبه همین دلیل، «مونو» به‌تنهایی نام یک کود مشخص نیست و برای شناخت دقیق آن باید نام کامل کود یا آنالیز محصول بررسی شود. برای مثال، مونو پتاسیم فسفات منبع فسفر و پتاسیم و مونو آمونیوم فسفات منبع نیتروژن و فسفر است.\"}},{\"@type\":\"Question\",\"name\":\"تفاوت کود نیتروژن و کود اوره  چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"تفاوت اصلی این است که نیتروژن یک عنصر غذایی است، اما اوره یک نوع کود نیتروژنه محسوب می‌شود. کودهای نیتروژنه گروهی از کودها هستند که نیتروژن مورد نیاز گیاه را تأمین می‌کنند و شامل انواع مختلفی مانند اوره، نیترات آمونیوم و سولفات آمونیوم می‌شوند.\\nاوره با فرمول CO(NH₂)₂ یکی از پرمصرف‌ترین منابع نیتروژن است و حدود ۴۶٪ نیتروژن دارد. بنابراین هر اوره یک کود نیتروژنه است، اما هر کود نیتروژنه الزاماً اوره نیست. انتخاب بین انواع کودهای نیتروژنه به محصول، مرحله رشد، شرایط خاک و روش مصرف بستگی دارد.\"}},{\"@type\":\"Question\",\"name\":\"کود سولفات چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود سولفات به گروهی از کودها گفته می‌شود که یکی از عناصر غذایی مورد نیاز گیاه را به شکل سولفات تأمین می‌کنند. از انواع شناخته‌شده آن می‌توان به سولفات پتاسیم، سولفات آمونیوم، سولفات منیزیم و سولفات روی اشاره کرد. بسته به نوع کود، علاوه بر عنصر اصلی، ممکن است گوگرد نیز در اختیار گیاه قرار گیرد.\\nکودهای سولفاته برای تأمین عناصر غذایی و جبران کمبودهای گیاه استفاده می‌شوند و نوع مناسب آن باید بر اساس نیاز محصول و شرایط خاک انتخاب شود. برای مثال، سولفات پتاسیم هم پتاسیم و هم گوگرد تأمین می‌کند، در حالی که سولفات روی منبع روی و گوگرد است.\"}},{\"@type\":\"Question\",\"name\":\"کود کمپلکس چیست؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"کود کمپلکس کودی است که در آن چندین عنصر غذایی (مثل ازت، فسفر و پتاسیم) به‌صورت یکپارچه در هر دانه کود ترکیب شده‌اند. برخلاف کودهای مخلوط ساده، در کود کمپلکس تمامی عناصر در یک دانه واحد وجود دارند؛ بنابراین هنگام کودپاشی، تغذیه گیاه در تمام نقاط مزرعه کاملاً یکنواخت و متعادل انجام می‌شود.\\nاین کودها که معمولاً به شکل گرانول هستند، ماندگاری بهتری در خاک دارند و از هدررفت مواد غذایی جلوگیری می‌کنند. استفاده از کود کمپلکس به دلیل راحتی در مصرف و تأمین هم‌زمان چندین نیاز اصلی گیاه، یکی از روش‌های به‌صرفه و کاربردی برای تغذیه پایه محصولات زراعی و باغی محسوب می‌شود.\"}}]}\u003c/script>\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\u003c/div>\n\t\t\t\t\u003c/div>\n\t\t\t\u003c/div>\n\t\t\u003c/div>\n\t\u003c/div>\n\u003c/section>\n\n\n\u003cscript>\n\tdocument.addEventListener('DOMContentLoaded', function() {\n\t\tconst searchBox = document.getElementById('faqSearchInput');\n\t\tif (!searchBox) return;\n\n\t\tconst items = document.querySelectorAll('.accordion-item');\n\n\t\tsearchBox.addEventListener('keyup', function() {\n\t\t\tconst term = this.value.trim().toLowerCase();\n\t\t\tlet hasResult = false;\n\n\t\t\titems.forEach(item => {\n\t\t\t\tconst question = item.querySelector('.accordion-header button')?.innerText.toLowerCase() || '';\n\t\t\t\tconst answer = item.querySelector('.accordion-body')?.innerText.toLowerCase() || '';\n\n\t\t\t\tif (term === '' || question.includes(term) || answer.includes(term)) {\n\t\t\t\t\titem.style.display = '';\n\t\t\t\t\thasResult = true;\n\t\t\t\t} else {\n\t\t\t\t\titem.style.display = 'none';\n\t\t\t\t}\n\t\t\t});\n\n\t\t\t// نمایش پیام \"نتیجه‌ای یافت نشد\"\n\t\t\tlet noResultMsg = document.getElementById('noResultMsg');\n\t\t\tif (!hasResult && term !== '') {\n\t\t\t\tif (!noResultMsg) {
